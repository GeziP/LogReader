name: Quality CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ '**' ]

env:
  QT_VERSION: '5.15.2'

jobs:
  static-analysis:
    name: Static Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            qt_arch: clang_64
            qt_modules: qtbase qtcharts qtwebengine
          - os: windows-latest
            qt_arch: windows_x64
            qt_modules: qtbase qtcharts qtwebengine
          - os: ubuntu-latest
            qt_arch: linux_x64
            qt_modules: qtbase qtcharts qtwebengine
    steps:
      - uses: actions/checkout@v4

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}

      # Install required tools per OS
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y mingw cmake ninja
          echo "C:\ProgramData\chocolatey\bin;C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "[INFO] Windows依赖已安装，环境变量已设置"
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qtbase5-dev qttools5-dev-tools libgl1-mesa-dev libicu-dev
          echo "[INFO] Linux依赖已安装"
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm cppcheck || true
          # 确保LLVM工具在PATH中
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Setup Qt/MinGW env (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          set QT_ROOT=C:\Qt\5.15.2\mingw81_64
          set Qt5_DIR=%QT_ROOT%\lib\cmake\Qt5
          set CMAKE_PREFIX_PATH=%QT_ROOT%
          set MINGW_BIN=C:\Qt\Tools\mingw810_64\bin
          set PATH=%QT_ROOT%\bin;%MINGW_BIN%;%PATH%
          echo "[INFO] CI环境变量已设置：QT_ROOT=%QT_ROOT%, MINGW_BIN=%MINGW_BIN%"
          echo "QT_ROOT=%QT_ROOT%" >> $GITHUB_ENV
          echo "Qt5_DIR=%Qt5_DIR%" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=%CMAKE_PREFIX_PATH%" >> $GITHUB_ENV
          echo "PATH=%QT_ROOT%\bin;%MINGW_BIN%;$PATH" >> $GITHUB_ENV
      - name: Setup Qt env (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export QT_ROOT=/opt/Qt/5.15.2/gcc_64
          export Qt5_DIR=$QT_ROOT/lib/cmake/Qt5
          export CMAKE_PREFIX_PATH=$QT_ROOT
          export PATH=$QT_ROOT/bin:$PATH
          echo "[INFO] CI环境变量已设置：QT_ROOT=$QT_ROOT"
          echo "QT_ROOT=$QT_ROOT" >> $GITHUB_ENV
          echo "Qt5_DIR=$Qt5_DIR" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
          echo "PATH=$QT_ROOT/bin:$PATH" >> $GITHUB_ENV

      - name: Configure & Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . -- -j2
      - name: Configure & Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -- -j$(nproc || echo 2)

      - name: clang-format Check
        shell: bash
        run: |
          # 跨平台兼容的clang-format检查
          if command -v clang-format >/dev/null 2>&1; then
            git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror
          else
            echo "Warning: clang-format not found, skipping format check"
          fi

      - name: clang-tidy Analysis
        shell: bash
        run: |
          # 跨平台兼容的clang-tidy检查
          if command -v clang-tidy >/dev/null 2>&1; then
            clang-tidy -p build $(git ls-files '*.cpp') || true
          else
            echo "Warning: clang-tidy not found, skipping analysis"
          fi

      - name: cppcheck Analysis
        shell: bash
        run: |
          # 跨平台兼容的cppcheck检查
          if command -v cppcheck >/dev/null 2>&1; then
            bash scripts/run_cppcheck.sh build || true
          else
            echo "Warning: cppcheck not found, skipping analysis"
          fi

  # 预留动态分析及覆盖率任务
  # sanitizers:
  #   ... 

  # sanitizers job
  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtcharts qtwebengine
          arch: ${{ matrix.os == 'macos-latest' && 'clang_64' || '' }}
          
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y clang clang-tidy lcov
          
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm lcov || true
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          
      - name: Configure with Sanitizers
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug \
                   -DCMAKE_C_FLAGS="-fsanitize=address,undefined" \
                   -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" \
                   -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                   -DENABLE_TESTING=ON
                   
      - name: Build & Tests
        run: |
          cd build
          # 使用跨平台兼容的CPU核心数检测
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          make -j$NPROC
          # 运行测试（如果存在）
          if [ -f CTestTestfile.cmake ]; then
            ctest --output-on-failure || true
          else
            echo "No tests configured, skipping test execution"
          fi

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtcharts qtwebengine
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y lcov gcc g++
          
      - name: Configure coverage
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug \
                   -DENABLE_CODE_COVERAGE=ON \
                   -DENABLE_TESTING=ON \
                   -DENABLE_COVERAGE=ON \
                   -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                   -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
                   -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
                   
      - name: Build & Tests
        run: |
          cd build
          make -j$(nproc)
          # 运行测试以生成coverage数据
          if [ -f CTestTestfile.cmake ]; then
            ctest --output-on-failure || true
          else
            echo "No tests configured, creating dummy coverage data"
            # 运行主程序生成一些coverage数据
            timeout 5s ./LogReader --help || true
          fi
          
      - name: Generate lcov report
        run: |
          cd build
          # 确保有coverage数据
          if [ -n "$(find . -name '*.gcda' -print -quit)" ]; then
            lcov --capture --directory . --output-file coverage.info
            lcov --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage.info
            lcov --list coverage.info
          else
            echo "No coverage data found (.gcda files), creating empty report"
            lcov --capture --directory . --output-file coverage.info --ignore-errors empty || true
            echo "Coverage report created with available data"
          fi
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: build/coverage.info
          fail_ci_if_error: false
          verbose: true 