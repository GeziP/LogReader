name: Quality CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ '**' ]

env:
  QT_VERSION: '5.15.2'

jobs:
  static-analysis:
    name: Static Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtcharts qtwebengine

      # Install required tools per OS (Linux shown as example)
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y clang clang-tidy clang-format cppcheck

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          choco install cppcheck -y

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm cppcheck || true

      - name: Configure (CMake)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-format Check
        run: |
          git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

      - name: clang-tidy Analysis
        run: |
          clang-tidy -p build $(git ls-files '*.cpp') || true

      - name: cppcheck Analysis
        run: |
          bash scripts/run_cppcheck.sh build

  # 预留动态分析及覆盖率任务
  # sanitizers:
  #   ... 

  # sanitizers job
  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtcharts qtwebengine
          
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y clang clang-tidy lcov
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm lcov || true
      - name: Configure with Sanitizers
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build & Tests
        run: |
          cd build
          make -j$(nproc || sysctl -n hw.ncpu)
          ctest --output-on-failure || true

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtcharts qtwebengine
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y lcov gcc g++
      - name: Configure coverage
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_CODE_COVERAGE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS="--coverage" -DCMAKE_CXX_FLAGS="--coverage"
      - name: Build & Tests
        run: |
          cd build
          make -j$(nproc)
          ctest --output-on-failure || true
      - name: Generate lcov report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: build/coverage.info
          fail_ci_if_error: true 