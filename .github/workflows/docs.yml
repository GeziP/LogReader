name: Documentation Generation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

jobs:
  # 生成 Doxygen API 文档
  generate-api-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz plantuml
        
    - name: Install Qt for header parsing
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        
    - name: Create Doxygen configuration
      run: |
        cat > Doxyfile << EOF
        # LogReader Doxygen Configuration
        # Author: GeziP
        # Date: 2025-06-27
        
        PROJECT_NAME           = "LogReader"
        PROJECT_NUMBER         = "v1.0.0"
        PROJECT_BRIEF          = "Professional Log Analysis Tool"
        PROJECT_LOGO           = "resources/icons/app_icon.png"
        
        OUTPUT_DIRECTORY       = docs/api
        CREATE_SUBDIRS         = YES
        
        INPUT                  = src/ README.md
        RECURSIVE              = YES
        FILE_PATTERNS          = *.cpp *.h *.md
        EXCLUDE_PATTERNS       = */build/* */tests/* */.git/*
        
        SOURCE_BROWSER         = YES
        INLINE_SOURCES         = NO
        STRIP_CODE_COMMENTS    = NO
        REFERENCED_BY_RELATION = YES
        REFERENCES_RELATION    = YES
        
        GENERATE_HTML          = YES
        HTML_OUTPUT            = html
        HTML_FILE_EXTENSION    = .html
        HTML_COLORSTYLE_HUE    = 220
        HTML_COLORSTYLE_SAT    = 100
        HTML_COLORSTYLE_GAMMA  = 80
        HTML_TIMESTAMP         = YES
        HTML_DYNAMIC_SECTIONS  = YES
        HTML_INDEX_NUM_ENTRIES = 100
        
        GENERATE_LATEX         = NO
        GENERATE_RTF           = NO
        GENERATE_MAN           = NO
        GENERATE_XML           = YES
        
        CLASS_DIAGRAMS         = YES
        HAVE_DOT               = YES
        DOT_IMAGE_FORMAT       = svg
        INTERACTIVE_SVG        = YES
        DOT_TRANSPARENT        = YES
        DOT_MULTI_TARGETS      = YES
        GENERATE_LEGEND        = YES
        
        EXTRACT_ALL            = YES
        EXTRACT_PRIVATE        = NO
        EXTRACT_STATIC         = YES
        EXTRACT_LOCAL_CLASSES  = YES
        
        ENABLE_PREPROCESSING   = YES
        MACRO_EXPANSION        = YES
        EXPAND_ONLY_PREDEF     = NO
        SEARCH_INCLUDES        = YES
        INCLUDE_PATH           = src/
        
        PREDEFINED             = Q_OBJECT \\
                                QT_VERSION_CHECK(major,minor,patch)=1 \\
                                Q_DECLARE_METATYPE(Type)= \\
                                Q_PROPERTY(Type)=
        
        SHOW_USED_FILES        = YES
        SHOW_FILES             = YES
        SHOW_NAMESPACES        = YES
        
        QUIET                  = NO
        WARNINGS               = YES
        WARN_IF_UNDOCUMENTED   = YES
        WARN_IF_DOC_ERROR      = YES
        WARN_NO_PARAMDOC       = NO
        
        ALPHABETICAL_INDEX     = YES
        COLS_IN_ALPHA_INDEX    = 5
        
        SEARCHENGINE           = YES
        SERVER_BASED_SEARCH    = NO
        EXTERNAL_SEARCH        = NO
        EOF
        
    - name: Generate API documentation
      run: |
        echo "🔧 Generating API documentation with Doxygen..."
        doxygen Doxyfile
        
        # 检查生成结果
        if [ -d "docs/api/html" ]; then
          echo "✅ API documentation generated successfully"
          echo "📊 Documentation statistics:"
          find docs/api/html -name "*.html" | wc -l | xargs echo "HTML files:"
          find docs/api/html -name "*.svg" | wc -l | xargs echo "SVG diagrams:"
          du -sh docs/api/html | xargs echo "Total size:"
        else
          echo "❌ Failed to generate API documentation"
          exit 1
        fi
        
    - name: Upload API documentation
      uses: actions/upload-artifact@v4.6.2
      with:
        name: api-documentation
        path: docs/api/
        retention-days: 30

  # 部署到 GitHub Pages（仅在main分支）
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [generate-api-docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download documentation
      uses: actions/download-artifact@v3
      with:
        name: api-documentation
        path: docs/
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/api/html
        commit_message: 'docs: update API documentation [skip ci]'
        
    - name: Create deployment summary
      run: |
        echo "🚀 Documentation deployed successfully!"
        echo "📖 API Documentation: Available at GitHub Pages"
        echo "🔗 URL: https://your-username.github.io/LogReader" 