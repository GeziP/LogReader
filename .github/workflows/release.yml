name: Release Build and Deploy

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送版本标签 (v1.0.0, v2.1.3, etc.)
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  QT_VERSION: '6.5.3'
  CMAKE_BUILD_TYPE: Release

jobs:
  # 创建 GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Generate changelog
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "## 🚀 LogReader ${{ steps.get_version.outputs.version }} Release" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### ✨ New Features" >> $GITHUB_OUTPUT
        echo "- 多平台自动构建和发布" >> $GITHUB_OUTPUT
        echo "- 完整的CI/CD流程" >> $GITHUB_OUTPUT
        echo "- 代码质量自动检查" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 🔧 Improvements" >> $GITHUB_OUTPUT
        echo "- 优化构建性能" >> $GITHUB_OUTPUT
        echo "- 增强错误处理" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 📦 Available Downloads" >> $GITHUB_OUTPUT
        echo "- Windows (x64) - 可执行文件和安装包" >> $GITHUB_OUTPUT
        echo "- macOS (Intel/ARM) - DMG安装包" >> $GITHUB_OUTPUT
        echo "- Linux (x64) - AppImage和deb包" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        release_name: LogReader ${{ steps.get_version.outputs.version }}
        body: ${{ steps.changelog.outputs.CHANGELOG }}
        draft: false
        prerelease: false

  # Windows 平台构建和打包
  build-windows:
    name: Build Windows Release
    needs: create-release
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          - arch: x64
            qt-arch: win64_msvc2019_64
            
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        arch: ${{ matrix.qt-arch }}
        tools: 'tools_ifw'  # 安装 Qt Installer Framework
        
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
        
    - name: Compile translations
      run: |
        Get-ChildItem translations/*.ts | ForEach-Object {
          Write-Host "Compiling $($_.Name)"
          lrelease $_.FullName
        }
        
    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
        cmake --build . --config ${{ env.CMAKE_BUILD_TYPE }}
        
    - name: Deploy Qt dependencies
      run: |
        cd build
        windeployqt.exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw LogReader.exe
        
        # 复制翻译文件到部署目录
        Copy-Item "../translations/*.qm" . -Force
        
    - name: Create portable package
      run: |
        $VERSION = "${{ needs.create-release.outputs.version }}"
        $PACKAGE_NAME = "LogReader-$VERSION-Windows-x64-Portable"
        
        # 创建便携版目录
        New-Item -ItemType Directory -Path $PACKAGE_NAME -Force
        
        # 复制文件
        Copy-Item "build/LogReader.exe" $PACKAGE_NAME/ -Force
        Copy-Item "build/*.dll" $PACKAGE_NAME/ -Force -ErrorAction SilentlyContinue
        Copy-Item "build/platforms" $PACKAGE_NAME/ -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item "build/imageformats" $PACKAGE_NAME/ -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item "build/*.qm" $PACKAGE_NAME/ -Force -ErrorAction SilentlyContinue
        Copy-Item "README.md" $PACKAGE_NAME/ -Force
        Copy-Item "LICENSE" $PACKAGE_NAME/ -Force
        
        # 创建ZIP包
        Compress-Archive -Path $PACKAGE_NAME -DestinationPath "$PACKAGE_NAME.zip"
        
    - name: Create Windows Installer (NSIS)
      run: |
        # 这里可以添加 NSIS 脚本来创建安装包
        # 现在先创建一个简单的自解压包
        echo "Windows installer creation would go here"
        
    - name: Upload portable package
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: LogReader-${{ needs.create-release.outputs.version }}-Windows-x64-Portable.zip
        asset_name: LogReader-${{ needs.create-release.outputs.version }}-Windows-x64-Portable.zip
        asset_content_type: application/zip

  # macOS 平台构建和打包
  build-macos:
    name: Build macOS Release
    needs: create-release
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        
    - name: Compile translations
      run: |
        for ts_file in translations/*.ts; do
          if [ -f "$ts_file" ]; then
            echo "Compiling $ts_file"
            lrelease "$ts_file"
          fi
        done
        
    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
        cmake --build . --config ${{ env.CMAKE_BUILD_TYPE }}
        
    - name: Create App Bundle
      run: |
        cd build
        
        # 创建应用包结构
        mkdir -p LogReader.app/Contents/{MacOS,Resources,Frameworks}
        
        # 复制可执行文件
        cp LogReader LogReader.app/Contents/MacOS/
        
        # 创建 Info.plist
        cat > LogReader.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>LogReader</string>
            <key>CFBundleIdentifier</key>
            <string>com.logviewer.LogReader</string>
            <key>CFBundleName</key>
            <string>LogReader</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.create-release.outputs.version }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.create-release.outputs.version }}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
        </dict>
        </plist>
        EOF
        
        # 部署 Qt 依赖
        macdeployqt LogReader.app
        
        # 复制翻译文件
        cp ../translations/*.qm LogReader.app/Contents/Resources/ || true
        
    - name: Create DMG
      run: |
        cd build
        VERSION=${{ needs.create-release.outputs.version }}
        DMG_NAME="LogReader-$VERSION-macOS"
        
        # 创建临时目录
        mkdir dmg_temp
        cp -R LogReader.app dmg_temp/
        
        # 创建 DMG
        hdiutil create -volname "LogReader $VERSION" -srcfolder dmg_temp -ov -format UDZO "$DMG_NAME.dmg"
        
    - name: Upload DMG
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: build/LogReader-${{ needs.create-release.outputs.version }}-macOS.dmg
        asset_name: LogReader-${{ needs.create-release.outputs.version }}-macOS.dmg
        asset_content_type: application/octet-stream

  # Linux 平台构建和打包
  build-linux:
    name: Build Linux Release
    needs: create-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
          fuse
          
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        
    - name: Compile translations
      run: |
        for ts_file in translations/*.ts; do
          if [ -f "$ts_file" ]; then
            echo "Compiling $ts_file"
            lrelease "$ts_file"
          fi
        done
        
    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
        cmake --build . --config ${{ env.CMAKE_BUILD_TYPE }}
        
    - name: Create AppImage
      run: |
        cd build
        VERSION=${{ needs.create-release.outputs.version }}
        
        # 下载 linuxdeployqt
        wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
        chmod +x linuxdeployqt-continuous-x86_64.AppImage
        
        # 创建 AppDir 结构
        mkdir -p LogReader.AppDir/usr/bin
        mkdir -p LogReader.AppDir/usr/share/applications
        mkdir -p LogReader.AppDir/usr/share/icons/hicolor/256x256/apps
        
        # 复制可执行文件
        cp LogReader LogReader.AppDir/usr/bin/
        
        # 复制翻译文件
        mkdir -p LogReader.AppDir/usr/share/LogReader/translations
        cp ../translations/*.qm LogReader.AppDir/usr/share/LogReader/translations/ || true
        
        # 创建 .desktop 文件
        cat > LogReader.AppDir/LogReader.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=LogReader
        Comment=Professional Log Analysis Tool
        Exec=LogReader
        Icon=LogReader
        Categories=Development;Utility;
        EOF
        
        # 复制图标（如果存在）
        if [ -f ../resources/icons/app_icon.png ]; then
          cp ../resources/icons/app_icon.png LogReader.AppDir/usr/share/icons/hicolor/256x256/apps/LogReader.png
          cp ../resources/icons/app_icon.png LogReader.AppDir/LogReader.png
        fi
        
        cp LogReader.AppDir/LogReader.desktop LogReader.AppDir/usr/share/applications/
        
        # 创建 AppImage
        ./linuxdeployqt-continuous-x86_64.AppImage LogReader.AppDir/LogReader.desktop -appimage
        
        # 重命名
        mv LogReader-*.AppImage "LogReader-$VERSION-Linux-x86_64.AppImage"
        
    - name: Upload AppImage
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: build/LogReader-${{ needs.create-release.outputs.version }}-Linux-x86_64.AppImage
        asset_name: LogReader-${{ needs.create-release.outputs.version }}-Linux-x86_64.AppImage
        asset_content_type: application/octet-stream

  # 发布后处理
  post-release:
    name: Post Release Actions
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Update release notes
      run: |
        echo "📦 Release ${{ needs.create-release.outputs.version }} completed!"
        echo "✅ Windows: Ready"
        echo "✅ macOS: Ready" 
        echo "✅ Linux: Ready"
        
    - name: Notify success
      if: success()
      run: |
        echo "🎉 Release ${{ needs.create-release.outputs.version }} published successfully!"
        echo "All platform packages are available for download."
        
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Release ${{ needs.create-release.outputs.version }} failed!"
        echo "Please check the workflow logs for details." 