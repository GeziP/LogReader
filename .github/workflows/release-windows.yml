name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'

env:
  QT_VERSION: '6.5.3'
  CMAKE_BUILD_TYPE: 'Release'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v${{ steps.get_version.outputs.version }} \
          --title "LogReader v${{ steps.get_version.outputs.version }}" \
          --notes "LogReader v${{ steps.get_version.outputs.version }} Windows Release"

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1
      
    - name: Compile translations
      run: |
        Get-ChildItem "translations\*.ts" | ForEach-Object {
          lrelease $_.FullName
        }
        
    - name: Build project
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
        cmake --build . --config ${{ env.CMAKE_BUILD_TYPE }}
        
    - name: Deploy Qt dependencies
      run: |
        cd build
        if (Test-Path "Release\LogReader.exe") {
          cd Release
          windeployqt.exe --release --no-translations LogReader.exe
          Copy-Item "..\..\translations\*.qm" "." -Force -ErrorAction SilentlyContinue
          cd ..
        } else {
          windeployqt.exe --release --no-translations LogReader.exe
          Copy-Item "..\translations\*.qm" "." -Force -ErrorAction SilentlyContinue
        }
        
    - name: Create package
      run: |
        $VERSION = "${{ needs.create-release.outputs.version }}"
        $PACKAGE_NAME = "LogReader-$VERSION-Windows-x64-Portable"
        
        New-Item -ItemType Directory -Path $PACKAGE_NAME -Force
        
        cd build
        if (Test-Path "Release") {
          Copy-Item "Release\*" "..\$PACKAGE_NAME\" -Recurse -Force
        } else {
          Copy-Item "*" "..\$PACKAGE_NAME\" -Recurse -Force -Exclude @("CMakeFiles", "*.cmake")
        }
        
        cd ..
        Copy-Item "README.md" "$PACKAGE_NAME\" -Force -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" "$PACKAGE_NAME\" -Force -ErrorAction SilentlyContinue
        
        Compress-Archive -Path $PACKAGE_NAME -DestinationPath "$PACKAGE_NAME.zip"
        
    - name: Upload package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $VERSION = "${{ needs.create-release.outputs.version }}"
        gh release upload v$VERSION "LogReader-$VERSION-Windows-x64-Portable.zip" 