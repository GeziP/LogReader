name: Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  QT_VERSION: '6.5.3'

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        
    - name: Compile translations
      run: |
        Get-ChildItem "translations\*.ts" | ForEach-Object {
          Write-Host "Compiling $($_.Name)"
          lrelease $_.FullName
        }
        
    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release
        
    - name: Deploy Qt
      run: |
        cd build
        if (Test-Path "Release\LogReader.exe") {
          cd Release
          windeployqt --release LogReader.exe
          Copy-Item "..\..\translations\*.qm" . -ErrorAction SilentlyContinue
        } else {
          windeployqt --release LogReader.exe  
          Copy-Item "..\translations\*.qm" . -ErrorAction SilentlyContinue
        }
        
    - name: Package
      run: |
        # Get version from tag or use default
        if ("${{ github.ref }}" -like "refs/tags/v*") {
          $VERSION = "${{ github.ref }}".Replace("refs/tags/v", "")
        } else {
          $VERSION = "1.0.0"
        }
        
        $PACKAGE = "LogReader-$VERSION-Windows-Portable"
        New-Item -ItemType Directory $PACKAGE -Force
        
        cd build
        if (Test-Path "Release") {
          Copy-Item "Release\*" "..\$PACKAGE\" -Recurse -Force
        } else {
          Get-ChildItem . -Exclude "CMakeFiles","*.cmake","CMakeCache.txt" | Copy-Item -Destination "..\$PACKAGE\" -Recurse -Force
        }
        
        cd ..
        Copy-Item "README.md" "$PACKAGE\" -ErrorAction SilentlyContinue
        
        Compress-Archive $PACKAGE "$PACKAGE.zip"
        Write-Host "Created: $PACKAGE.zip"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: LogReader-Windows
        path: "*.zip" 